services:
  api:
    build: .
    container_name: code-review-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: code-review-worker
    env_file:
      - .env
    command: python -m workers.review_worker